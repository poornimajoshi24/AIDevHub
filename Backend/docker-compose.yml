version: '3.8'

services:
  # 1. Primary MongoDB Database Container
  mongo:
    image: mongo:7.0-alpine
    container_name: aidevhub-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: aidevhub
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aidevhub-network

  # 2. Redis Caching & BullMQ Queue Container
  redis:
    image: redis:7-alpine
    container_name: aidevhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aidevhub-network

  # 3. Node.js Single-Port Application Service (Express + Socket.IO + React SPA)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aidevhub-app
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=mongodb://mongo:27017/aidevhub
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URI=redis://redis:6379
      - ACCESS_TOKEN_SECRET=aidevhub_access_secret_key_2026_super_secure
      - REFRESH_TOKEN_SECRET=aidevhub_refresh_secret_key_2026_super_secure
      - CORS_ORIGIN=*
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aidevhub-network

  # 4. Nginx Reverse Proxy Container (Port 80/443 Forwarding)
  proxy:
    image: nginx:1.25-alpine
    container_name: aidevhub-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - aidevhub-network

networks:
  aidevhub-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
