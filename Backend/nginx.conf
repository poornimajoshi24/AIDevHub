events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging Formats
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance Adjustments
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream Node.js Single-Port Application Server
    upstream node_app {
        server app:5001;
        keepalive 32;
    }

    # HTTP Server (Port 80)
    server {
        listen 80;
        server_name aidevhub.io www.aidevhub.io localhost;

        # Max File Upload Size (20MB for Resume uploads)
        client_max_body_size 20M;

        # Location Proxy for REST APIs, WebSockets & SPA Static Assets
        location / {
            proxy_pass http://node_app;
            proxy_http_version 1.1;

            # WebSocket Support Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard Proxy Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Proxy Timeouts
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Health Check Route
        location /health {
            access_log off;
            proxy_pass http://node_app/api/v1/health;
        }
    }
}
